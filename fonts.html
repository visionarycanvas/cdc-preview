</style></head><body><h1>写真の上のメッセージ　書体の見比べ</h1><p class="lead">英字はどれも Allura（筆記体）。日本語の書体だけを変えています。</p><div class="g">
<figure class="c" style="background-image:url(img/fog-road.jpg);background-position:70% 40%"><figcaption>A　ペン書き（太め）・いま<small>Klee One</small></figcaption><p class="m"><span class="en">Open the door within.</span><span class="jp" style="font-family:'Klee One';font-weight:600">霧の中で、<br>内省の扉を開く。</span></p></figure>
<figure class="c" style="background-image:url(img/dawn-full.jpg);background-position:center 55%"><figcaption>B　ペン書き（細め）<small>Klee One</small></figcaption><p class="m"><span class="en">Notice your own light.</span><span class="jp" style="font-family:'Klee One';font-weight:400">夜明けのように、<br>自分のエネルギーに気づく。</span></p></figure>
<figure class="c" style="background-image:url(img/fog-road.jpg);background-position:70% 40%"><figcaption>C　サインペンの手書き<small>Zen Kurenaido</small></figcaption><p class="m"><span class="en">Open the door within.</span><span class="jp" style="font-family:'Zen Kurenaido';font-weight:400">霧の中で、<br>内省の扉を開く。</span></p></figure>
<figure class="c" style="background-image:url(img/dawn-full.jpg);background-position:center 55%"><figcaption>D　やわらかい手書き<small>Yomogi</small></figcaption><p class="m"><span class="en">Notice your own light.</span><span class="jp" style="font-family:'Yomogi';font-weight:400">夜明けのように、<br>自分のエネルギーに気づく。</span></p></figure>
<figure class="c" style="background-image:url(img/fog-road.jpg);background-position:70% 40%"><figcaption>E　手書きの明朝<small>Hina Mincho</small></figcaption><p class="m"><span class="en">Open the door within.</span><span class="jp" style="font-family:'Hina Mincho';font-weight:400">霧の中で、<br>内省の扉を開く。</span></p></figure>
<figure class="c" style="background-image:url(img/dawn-full.jpg);background-position:center 55%"><figcaption>F　流れる筆文字（くずし強め）<small>Yuji Mai</small></figcaption><p class="m"><span class="en">Notice your own light.</span><span class="jp" style="font-family:'Yuji Mai';font-weight:400">夜明けのように、<br>自分のエネルギーに気づく。</span></p></figure>
<figure class="c" style="background-image:url(img/fog-road.jpg);background-position:70% 40%"><figcaption>G　筆文字（落ち着いた楷書寄り）<small>Yuji Syuku</small></figcaption><p class="m"><span class="en">Open the door within.</span><span class="jp" style="font-family:'Yuji Syuku';font-weight:400">霧の中で、<br>内省の扉を開く。</span></p></figure>
